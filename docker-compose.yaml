# Run AFTER: cd open-im-server && docker compose up -d
# Then:       cd im-business   && docker compose up -d --build

networks:
  openim:
    external: true
    name: open-im-server_openim

services:
  postgres-business:
    image: postgres:16-alpine
    container_name: postgres-business
    ports:
      - "15432:5432"
    environment:
      POSTGRES_DB: im_business
      POSTGRES_USER: im_business
      POSTGRES_PASSWORD: im_business123
    volumes:
      - postgres-business-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U im_business"]
      interval: 5s
      retries: 5
    restart: always
    networks:
      - openim

  im-business:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: im-business
    ports:
      - "10008:10008"
    command: ["-config", "config/config.yaml"]
    volumes:
      # Same config.yaml that host runs use. Container-only diffs (service
      # hostnames, mode, webhook URLs) come from `environment` below — viper's
      # AutomaticEnv + dot→underscore replacer maps env vars like POSTGRES_DSN
      # to the postgres.dsn yaml key.
      - ./config/config.yaml:/app/config/config.yaml:ro
    environment:
      SERVER_MODE: release
      POSTGRES_DSN: "host=postgres-business user=im_business password=im_business123 dbname=im_business port=5432 sslmode=disable TimeZone=Asia/Shanghai"
      REDIS_ADDR: "redis:6379"
      OPENIM_API_URL: "http://openim-server:10002"
      # Webhook URLs are empty in container mode: a public reverse proxy
      # supplies the externally reachable URL when actually deployed.
      WALLET_MORALIS_WEBHOOK_URL: ""
      WALLET_QUICKNODE_WEBHOOK_URL: ""
    depends_on:
      postgres-business:
        condition: service_healthy
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - openim

volumes:
  postgres-business-data:
