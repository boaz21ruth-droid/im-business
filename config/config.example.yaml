server:
  port: 10008
  mode: debug

postgres:
  dsn: "host=localhost user=im_business password=YOUR_PG_PASSWORD dbname=im_business port=5432 sslmode=disable TimeZone=Asia/Shanghai"

redis:
  addr: "localhost:16379"   # OpenIM infra exposes Redis on 16379 on host
  password: "YOUR_REDIS_PASSWORD"
  db: 5                     # db 0-4 used by OpenIM; use 5 to avoid collision

jwt:
  secret: "CHANGE-THIS-IN-PRODUCTION-32CHARS"
  expire_hours: 168         # 7 days

totp:
  # 32-byte AES key as 64 hex chars. Generate one with: openssl rand -hex 32
  encrypt_key: "YOUR-64-HEX-CHAR-AES-256-KEY-HERE"

openim:
  api_url: "http://localhost:10002"   # OpenIM API gateway
  admin_user_id: "imAdmin"
  secret: "YOUR_OPENIM_SECRET"         # matches open-im-server config/share.yml

wallet:
  stream_provider: moralis
  tx_providers:
    eth:         [alchemy, ankr, covalent, moralis]
    bsc:         [ankr, covalent, moralis]
    polygon:     [alchemy, ankr, covalent, moralis]
    arbitrum:    [alchemy, ankr, covalent, moralis]
    optimism:    [alchemy, ankr, covalent, moralis]
    bsc_testnet: [ankr, moralis]
    eth_sepolia: [alchemy, moralis]
    tron:        [trongrid]
    tron_shasta: [trongrid]
  moralis:
    api_key: "YOUR_MORALIS_API_KEY"
    webhook_secret: "YOUR_MORALIS_WEBHOOK_SECRET"
    webhook_url: "https://your-server.com/webhook/moralis"
  alchemy:
    api_key: "YOUR_ALCHEMY_API_KEY"
  ankr:
    api_key: ""         # optional; works without key, higher quota with key
  covalent:
    api_key: "YOUR_COVALENT_API_KEY"
